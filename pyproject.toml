[tool.poetry]
name = "country-subdivisions"
version = "0.1.0"
description = "Interactive webapp for generating Anki decks to memorize country subdivisions"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<4"
flask = "^3.1"
genanki = "^0.13"
geopandas = "^1.0"
matplotlib = "^3.9"
shapely = "^2.0"
requests = "^2.32"
pyogrio = "^0.10"
antimeridian = "^0.4.7"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
